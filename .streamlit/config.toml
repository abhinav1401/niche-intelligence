[theme]
base = "light"
primaryColor = "#007F73"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#162A3A"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
maxUploadSize = 1

[browser]
gatherUsageStats = false


[client]
showErrorDetails = "none"
toolbarMode = "viewer"
